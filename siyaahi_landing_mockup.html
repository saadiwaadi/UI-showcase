<style>
  :root{
    --ink-1: #101822;
    --ink-2: #1c2734;
    --ink-edge: #3c4d5f;
    --paper-1: #e9e3d5;
    --paper-2: #ded6c3;
    --charcoal: #201d1a;
    --off-white: #f3efe4;
    --rust: #a0492b;
    --ease-slow: cubic-bezier(0.22, 1, 0.36, 1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior: auto; }
  body{
    background: var(--paper-1);
    color: var(--charcoal);
    font-family: 'Space Mono', monospace;
    overflow-x: hidden;
    cursor: none;
  }
  @media (max-width: 768px){
    body{ cursor: auto; }
  }

  ::selection{ background: var(--charcoal); color: var(--off-white); }

  /* ---------- loader ---------- */
  #loader{
    position: fixed; inset: 0; z-index: 999;
    background: var(--ink-1);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.9s var(--ease-slow), visibility 0.9s;
  }
  #loader.done{ opacity: 0; visibility: hidden; pointer-events: none; }
  #loader svg circle{
    transform-origin: center;
    animation: inkdrop 1.1s var(--ease-slow) forwards;
  }
  @keyframes inkdrop{
    0%{ r: 0; opacity: 0.9; }
    100%{ r: 420; opacity: 0; }
  }

  /* ---------- custom cursor ---------- */
  #cursor{
    position: fixed; top:0; left:0; width: 12px; height: 12px;
    border-radius: 50%; background: var(--off-white);
    mix-blend-mode: difference;
    pointer-events: none; z-index: 998;
    transform: translate(-50%, -50%);
    transition: width 0.35s var(--ease-slow), height 0.35s var(--ease-slow), border-radius 0.35s var(--ease-slow);
  }
  #cursor.hover{
    width: 26px; height: 14px; border-radius: 40%;
  }
  @media (max-width: 768px){ #cursor{ display:none; } }

    font-family: 'Anton', sans-serif;
    font-size: clamp(3.2rem, 11vw, 8.5rem);
    line-height: 0.92;
    letter-spacing: 0.01em;
    display: flex; flex-direction: column; align-items: center;
  }
  .wm-siya{ color: var(--off-white); }
  .wm-ahi{
    color: var(--ink-1);
    background: var(--off-white);
    padding: 0 0.18em;
    margin-top: 0.05em;
  }
  #tagline{
    font-family: 'Caveat', cursive;
    font-size: clamp(1.1rem, 2.2vw, 1.6rem);
    color: var(--off-white);
    margin-top: 1.1rem;
    opacity: 0.85;
    letter-spacing: 0.02em;
  }
  #scroll-cue{
    position: absolute; bottom: 2.4rem; left: 50%; transform: translateX(-50%);
    z-index: 2;
    font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--off-white); opacity: 0.55;
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
  }
  #scroll-cue .line{ width: 1px; height: 30px; background: var(--off-white); opacity: 0.5;
    animation: pulse-line 2.4s ease-in-out infinite; }
  @keyframes pulse-line{ 0%,100%{ transform: scaleY(1); opacity:0.5;} 50%{ transform: scaleY(0.5); opacity:0.15;} }

  /* sticky banner label state (post-shrink) */
  #banner-rule{
    position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
    background: var(--charcoal); opacity: 0;
  }

  /* ================= CATALOG ================= */
  #catalog{
    position: relative; z-index: 3;
    background: var(--paper-1);
    padding: 7rem 6vw 8rem;
  }
  .section-label{
    font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase;
    opacity: 0.55; margin-bottom: 2.4rem;
    display: flex; align-items: center; gap: 0.8rem;
  }
  .section-label::after{ content:''; flex:1; height:1px; background: var(--charcoal); opacity:0.25; }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 2.4rem 1.6rem;
  }
  .card{
    position: relative;
    background: var(--ink-2);
    aspect-ratio: 4/5;
    border-radius: 2px;
    overflow: hidden;
    filter: contrast(0.6) saturate(0.3) blur(1px);
    opacity: 0.001;
    cursor: none;
  }
  @media (max-width: 768px){ .card{ cursor: auto; } }

    font-size: 0.65rem; letter-spacing: 0.12em; color: var(--off-white);
    align-self: flex-end;
  }
  .card-title{
    font-family: 'Anton', sans-serif;
    font-size: 1.1rem; color: var(--off-white);
    text-transform: uppercase; letter-spacing: 0.01em;
  }
  .card-meta{
    font-size: 0.62rem; opacity: 0.7; color: var(--off-white); margin-top: 0.3rem;
  }
  .card:nth-child(even) .card-meta{ color: var(--charcoal); }

  /* ================= BRAND STRIP ================= */
  #strip{
    background: var(--ink-1);
    color: var(--off-white);
    padding: 2.2rem 6vw;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 1rem;
    font-size: 0.72rem; letter-spacing: 0.1em;
  }
  #strip .wm-mini{
    font-family: 'Anton', sans-serif; font-size: 1rem; letter-spacing: 0.02em;
    display: flex;
  }
  #strip .wm-mini .a{ color: var(--charcoal); background: var(--off-white); padding: 0 0.15em; }
</style>
</head>
<body>

  <div id="loader">
    <svg width="0" height="0">
      <defs></defs>
    </svg>
    <svg viewBox="-210 -210 420 420" width="1" height="1" style="overflow:visible">
      <circle cx="0" cy="0" r="0" fill="#f3efe4"></circle>
    </svg>
  </div>

  <div id="cursor"></div>
  <div id="grain"></div>

  <!-- HERO + SHRINK -->
  <section id="hero-pin">
    <div id="hero-visual">
      <div id="ink-layer"></div>
      <div id="paper-layer"></div>
      <div id="banner-rule"></div>

      <div id="wordmark-wrap">
        <div class="wordmark">
          <span class="wm-siya">SIYA</span>
          <span class="wm-ahi">AHI.</span>
        </div>
        <div id="tagline">since 2025</div>
      </div>

      <div id="scroll-cue"><span class="line"></span>scroll</div>
    </div>
  </section>

  <!-- CATALOG -->
  <section id="catalog">
    <div class="section-label">Featured — no. 001–014</div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- BRAND STRIP -->
  <section id="strip">
    <div class="wm-mini"><span>SIYA</span><span class="a">AHI.</span></div>
    <div>PRINTS · STICKERS · POSTERS</div>
    <div>@SIYAAHI.PRINTS</div>
  </section>

<script>
gsap.registerPlugin(ScrollTrigger);

/* ---------- loader ---------- */
window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('loader').classList.add('done'), 900);
});

/* ---------- custom cursor (desktop only) ---------- */
const cursor = document.getElementById('cursor');
let mx = window.innerWidth/2, my = window.innerHeight/2, cx = mx, cy = my;
const isTouch = window.matchMedia('(max-width: 768px)').matches;

if(!isTouch){
  window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  const raf = () => {
    cx += (mx - cx) * 0.15;
    cy += (my - cy) * 0.15;
    cursor.style.transform = `translate(${cx}px, ${cy}px) translate(-50%,-50%)`;
    requestAnimationFrame(raf);
  };
  raf();
}

/* ---------- hero scrub: shrink + ink->paper handoff ---------- */
const wm = document.getElementById('wordmark-wrap');
const tagline = document.getElementById('tagline');
const paperLayer = document.getElementById('paper-layer');
const bannerRule = document.getElementById('banner-rule');
const heroVisual = document.getElementById('hero-visual');
const scrollCue = document.getElementById('scroll-cue');

gsap.timeline({
  scrollTrigger: {
    trigger: '#hero-pin',
    start: 'top top',
    end: 'bottom top',
    scrub: 1,
  }
})
.to(scrollCue, { opacity: 0, duration: 0.08 }, 0)
.to(wm, { scale: 0.32, y: () => -(window.innerHeight/2 - 56), duration: 1 }, 0)
.to(tagline, { opacity: 0, duration: 0.4 }, 0)
.to(paperLayer, { opacity: 1, duration: 0.4 }, 0.6)
.to(bannerRule, { opacity: 0.25, duration: 0.2 }, 0.8)
.to(heroVisual, { height: '76px', duration: 1 }, 0);

gsap.set(heroVisual, { height: '100vh' });
ScrollTrigger.create({
  trigger: '#hero-pin',
  start: 'top top',
  end: 'bottom top',
  pin: '#hero-visual',
  pinSpacing: false,
});

/* ---------- catalog grid: build 14 cards ---------- */
const items = [
  ['Kintsugi Fracture','sticker · matte vinyl'],
  ['Marble Study I','print · A3 riso'],
  ['Vessel, Cracked','sticker · die-cut'],
  ['Ink Bloom','poster · 18×24'],
  ['Study of Ruins','print · A3 riso'],
  ['Folded Marble','sticker · matte vinyl'],
  ['Sediment No. 4','poster · 18×24'],
  ['Quiet Fracture','print · A2 riso'],
  ['Carved Fragment','sticker · die-cut'],
  ['Ink on Bone','poster · 18×24'],
  ['Weathered Form','print · A3 riso'],
  ['Split Vessel','sticker · matte vinyl'],
  ['Ash & Marble','poster · 24×36'],
  ['Last Batch, No. 001','print · A2 riso — limited'],
];

const grid = document.getElementById('grid');
items.forEach((it, i) => {
  const el = document.createElement('div');
  el.className = 'card';
  el.style.setProperty('--bx', `${20 + (i*13)%60}%`);
  el.style.setProperty('--by', `${10 + (i*29)%70}%`);
  el.innerHTML = `
    <div class="card-inner">
      <div class="card-no">NO. ${String(i+1).padStart(3,'0')}</div>
      <div>
        <div class="card-title">${it[0]}</div>
        <div class="card-meta">${it[1]}</div>
      </div>
    </div>`;
  grid.appendChild(el);

  if(!isTouch){
    el.addEventListener('mouseenter', () => { el.classList.add('peel'); cursor.classList.add('hover'); });
    el.addEventListener('mouseleave', () => { el.classList.remove('peel'); cursor.classList.remove('hover'); });
  } else {
    el.addEventListener('touchstart', () => el.classList.add('peel'), {passive:true});
    el.addEventListener('touchend', () => el.classList.remove('peel'));
  }

  gsap.to(el, {
    opacity: 1,
    filter: 'contrast(1) saturate(1) blur(0px)',
    duration: 0.5,
    ease: 'power2.out',
    delay: (i % 4) * 0.08,
    scrollTrigger: {
      trigger: el,
      start: 'top 85%',
      toggleActions: 'play none none none',
    }
  });
});
</script>
</body>
</html>
